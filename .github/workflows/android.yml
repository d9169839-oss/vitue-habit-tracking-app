name: Android verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # The Google Services Gradle plugin expects a config file even for unit tests.
      # This placeholder is CI-only and contains no real Firebase credentials.
      - name: Create CI-only Firebase config
        run: |
          mkdir -p app
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789",
              "project_id": "vitue-ci-placeholder",
              "storage_bucket": "vitue-ci-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789:android:123456789",
                "android_client_info": { "package_name": "com.virtue.habittracker" }
              },
              "api_key": [{ "current_key": "ci-placeholder" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          JSON

      - name: Run unit tests and compile debug sources
        run: gradle testDebugUnitTest assembleDebug
